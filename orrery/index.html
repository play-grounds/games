window.addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
$('sSpeed').addEventListener('input', e => { const v = parseFloat(e.target.value); sim.speed = v < 1 ? v : Math.pow(v, 2.2); $('vSpeed').textContent = sim.speed.toFixed(1) + '×'; });
$('sLamp').addEventListener('input', e => { sim.lamp = parseFloat(e.target.value); $('vLamp').textContent = sim.lamp.toFixed(2); });
$('sRoom').addEventListener('input', e => { sim.roomLight = parseFloat(e.target.value); $('vRoom').textContent = sim.roomLight.toFixed(2); });
$('sVol').addEventListener('input', e => { setVolume(parseFloat(e.target.value)); $('vVol').textContent = parseFloat(e.target.value).toFixed(2); });
$('cDome').addEventListener('change', e => { dome.want = e.target.checked ? 1 : 0; status(dome.want ? 'Lowering the dome' : 'Lifting the dome'); });
$('cLabels').addEventListener('change', e => { cam.labels = e.target.checked; });
$('bEclipse').addEventListener('click', triggerEclipse); $('bAlign').addEventListener('click', triggerAlign); $('bComet').addEventListener('click', sendComet); $('bWind').addEventListener('click', windSpring);
$('mbCine').addEventListener('click', () => { ensureAudio(); cycleCinematic(); }); $('mbEclipse').addEventListener('click', triggerEclipse); $('mbAlign').addEventListener('click', triggerAlign); $('mbComet').addEventListener('click', sendComet); $('mbFollow').addEventListener('click', () => { unfollow(); cam.cine = -1; });
$('panelToggle').addEventListener('click', () => $('panel').classList.toggle('open'));

// ==== SOUND =========================================================================
/* clockwork ambience: a soft tick-tock locked to the escapement, a gear whirr that rises with speed, a hum from the sun lamp,
   a music-box note when Earth completes a year, a gong for totality, and a ratchet while winding. Unlocked on the first gesture. */
let audio = null; const SND = { volume: 0.3, master: null, whirr: null, hum: null, announced: false, lastTick: 0, lastYear: 0 };
function ensureAudio() {
  if (audio === false) return null;
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); SND.master = audio.createGain(); SND.master.gain.value = SND.volume; SND.master.connect(audio.destination);
    const len = audio.sampleRate * 5, buf = audio.createBuffer(1, len, audio.sampleRate), d = buf.getChannelData(0); let b = 0; for (let i = 0; i < len; i++) { b = (b + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = b * 3.5; } const f = Math.floor(audio.sampleRate * 0.05); for (let i = 0; i < f; i++) { d[i] *= i / f; d[len - 1 - i] *= i / f; }
    const src = audio.createBufferSource(); src.buffer = buf; src.loop = true; const bp = audio.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = 0.9; const g = audio.createGain(); g.gain.value = 0.08; src.connect(bp).connect(g).connect(SND.master); src.start(); SND.whirr = { g, bp };
    const hum = audio.createOscillator(); hum.type = 'sine'; hum.frequency.value = 96; const hg = audio.createGain(); hg.gain.value = 0.03; const h2 = audio.createOscillator(); h2.type = 'sine'; h2.frequency.value = 192.5; const hg2 = audio.createGain(); hg2.gain.value = 0.012; hum.connect(hg).connect(SND.master); h2.connect(hg2).connect(SND.master); hum.start(); h2.start(); SND.hum = hg;
    audio.onstatechange = () => { if (audio.state === 'running' && !SND.announced) { SND.announced = true; status('Sound on · volume in The Mechanism'); } }; } catch (e) { audio = false; return null; } }
  if (audio.state === 'suspended') audio.resume().catch(() => {}); return audio;
}
function setVolume(v) { SND.volume = v; if (SND.master) SND.master.gain.setTargetAtTime(v, audio.currentTime, 0.05); }
const running = () => audio && audio.state === 'running';
function tone(freq, gain, attack, decay, type = 'sine', sweepTo = null) { if (!running()) return; const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t); if (sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo, t + decay); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(0.0002, t + attack + decay); o.connect(g).connect(SND.master); o.start(t); o.stop(t + attack + decay + 0.05); }
function noiseBurst(len, freq, gain, decayPow = 3) { if (!running()) return; const t = audio.currentTime, buf = audio.createBuffer(1, audio.sampleRate * len, audio.sampleRate), d = buf.getChannelData(0); let b = 0; for (let i = 0; i < d.length; i++) { b = (b + 0.05 * (Math.random() * 2 - 1)) / 1.05; d[i] = b * 4 * Math.pow(1 - i / d.length, decayPow); } const s = audio.createBufferSource(); s.buffer = buf; const f = audio.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq; const g = audio.createGain(); g.gain.value = gain; s.connect(f).connect(g).connect(SND.master); s.start(t); }
function boom() { noiseBurst(0.9, 320, 0.7, 2.5); tone(60, 0.12, 0.005, 0.5, 'sine', 35); }
function thunder() { noiseBurst(2.6, 220, 0.6, 1.6); }
function plop(p) { tone(300 + p * 120, 0.06 * p, 0.004, 0.2, 'sine', 90); }
function tink() { tone(2100, 0.035, 0.002, 0.5); tone(3150, 0.015, 0.002, 0.35); }

function tickTock(hi) { if (!running()) return; const t = audio.currentTime; const buf = audio.createBuffer(1, Math.floor(audio.sampleRate * 0.03), audio.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2); const s = audio.createBufferSource(); s.buffer = buf; const f = audio.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = hi ? 3200 : 2300; f.Q.value = 1.2; const g = audio.createGain(); g.gain.value = 0.35; s.connect(f).connect(g).connect(SND.master); s.start(t); tone(hi ? 1800 : 1350, 0.12, 0.002, 0.07, 'triangle', hi ? 1200 : 900); }
function chime(k = 1) { for (const [f, g, d] of [[1046, 0.07, 2.4], [1568, 0.04, 2.0], [2093, 0.02, 1.3]]) tone(f, g * k, 0.005, d); }
function gong() { for (const [f, g, d] of [[196, 0.14, 4.5], [392, 0.07, 3.5], [587, 0.035, 2.5], [1176, 0.015, 1.2]]) tone(f, g, 0.01, d); }
function ratchet() { if (!running()) return; for (let i = 0; i < 12; i++) setTimeout(() => tone(700 + i * 20, 0.06, 0.002, 0.05, 'square'), i * 230); }
function updateSound(dt) {
  if (!running()) return; const t = audio.currentTime;
  const tickPhase = Math.floor(mech.tick * 2); if (tickPhase !== SND.lastTick) { SND.lastTick = tickPhase; tickTock(tickPhase % 2 === 0); }
  SND.whirr.g.gain.setTargetAtTime(0.07 + Math.min(1, sim.speed / 8) * 0.18 + (mech.winding > 0 ? 0.1 : 0), t, 0.3); SND.whirr.bp.frequency.setTargetAtTime(600 + Math.min(1, sim.speed / 8) * 900, t, 0.3);
  SND.hum.gain.setTargetAtTime(0.01 + sim.lamp * 0.03, t, 0.3);
  const yr = Math.floor(sim.years); if (yr !== SND.lastYear) { SND.lastYear = yr; chime(0.7); }
}

// ==== LOOP ==========================================================================
let last = performance.now(), fps = 60, frames = 0, fpsT = 0, hudT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now; frames++; fpsT += dt; if (fpsT > 0.5) { fps = frames / fpsT; frames = 0; fpsT = 0; }
  updateOrrery(dt); drawDynamic(dt); updateCamera(dt); if (audio) updateSound(dt);
  mouse.hoverT -= dt; if (mouse.hoverT > -0.1 && mouse.hoverT <= 0) { updateHover(); mouse.hoverT = -1; }
  renderer.render(scene, camera);
  hudT += dt; if (hudT > 0.4) { hudT = 0; $('hFps').textContent = fps.toFixed(0); $('hVox').textContent = totalVox.toLocaleString(); $('hYear').textContent = Math.floor(sim.years); }
}
let totalVox = 0;
(async () => {
  const msg = $('loadmsg'); const step = async m => { msg.textContent = m; await new Promise(r => setTimeout(r, 30)); };
  await step('casting the brass…'); initPools(); buildRoom();
  await step('turning the planets…'); buildPlanets(); spawnBelt(); buildCines();
  totalVox = room.count + sunGroup.voxels + bodies.reduce((n, b) => n + b.voxels, 0);
  $('load').style.display = 'none'; last = performance.now(); requestAnimationFrame(frame);
})();
</script>
