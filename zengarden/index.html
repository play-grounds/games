<style>

canvas.addEventListener('touchmove', e => { e.preventDefault(); if (e.touches.length === 1) { const t = e.touches[0], prev = touch.pts.get(t.identifier) || { x: t.clientX, y: t.clientY }; const dx = t.clientX - prev.x, dy = t.clientY - prev.y; if (Math.abs(t.clientX - touch.startX) + Math.abs(t.clientY - touch.startY) > 8) touch.moved = true; if (touch.moved) { cam.cine = -1; if (sim.tool === 'look') { cam.az -= dx * 0.006; cam.el = clamp(cam.el + dy * 0.006, 0.12, 1.45); } else { const h = groundHit(t.clientX, t.clientY); if (h) applyTool(h, true); } } } else if (e.touches.length >= 2) { const a = e.touches[0], b = e.touches[1]; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), mx = (a.clientX + b.clientX) / 2, my = (a.clientY + b.clientY) / 2; if (touch.lastDist > 0) cam.dist = clamp(cam.dist * touch.lastDist / d, 6, 120); const dx = mx - touch.midX, dy = my - touch.midY; cam.az -= dx * 0.006; cam.el = clamp(cam.el + dy * 0.006, 0.12, 1.45); cam.cine = -1; touch.lastDist = d; touch.midX = mx; touch.midY = my; } for (const t of e.changedTouches) touch.pts.set(t.identifier, { x: t.clientX, y: t.clientY }); }, { passive: false });
function touchEnd(e) { e.preventDefault(); ensureAudio(); for (const t of e.changedTouches) touch.pts.delete(t.identifier); if (e.touches.length === 0 && !touch.moved && performance.now() - touch.t0 < 400 && e.changedTouches.length === 1 && sim.tool !== 'look') { const t = e.changedTouches[0]; const h = groundHit(t.clientX, t.clientY); if (h) clickAction(h); } if (e.touches.length < 2) touch.lastDist = 0; if (e.touches.length === 1) touch.moved = true; }

function cycleCinematic() { cam.cine = cam.cine >= cines.length - 1 ? -1 : cam.cine + 1; if (cam.cine >= 0) { cam.cineT = 0; status(`Cinematic: ${cines[cam.cine].name}`); } else status('Free camera'); }
function toggleUI() { cam.hideUI = !cam.hideUI; for (const id of ['hud', 'panel', 'keys', 'mobilebar', 'panelToggle']) $(id).style.display = cam.hideUI ? 'none' : ''; }
function liftStones() { for (const s of stones) { scene.remove(s.mesh); s.mesh.geometry.dispose(); } stones.length = 0; status('The stones are lifted.'); }
window.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return; ensureAudio(); if (e.code === 'Space') { e.preventDefault(); cycleCinematic(); } else if (e.code === 'Digit1') setTool('rake'); else if (e.code === 'Digit2') setTool('stone'); else if (e.code === 'Digit3') setTool('smooth'); else if (e.code === 'Digit4') setTool('look'); else if (e.code === 'KeyB') bowl(); else if (e.code === 'Escape') cam.cine = -1; else if (e.code === 'KeyH') toggleUI(); });
window.addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
for (const [id, t] of [['mRake', 'rake'], ['mStone', 'stone'], ['mSmooth', 'smooth'], ['mLook', 'look'], ['mbRake', 'rake'], ['mbStone', 'stone'], ['mbLook', 'look']]) $(id).addEventListener('click', () => setTool(t));
$('sSeason').addEventListener('input', e => { season.t = parseFloat(e.target.value); }); $('cSeason').addEventListener('change', e => season.auto = e.target.checked);
$('sTime').addEventListener('input', e => { clock.t = parseFloat(e.target.value); }); $('cAuto').addEventListener('change', e => clock.auto = e.target.checked);
$('sWind').addEventListener('input', e => { sim.wind = parseFloat(e.target.value); $('vWind').textContent = sim.wind.toFixed(2); });
$('sVol').addEventListener('input', e => { setVolume(parseFloat(e.target.value)); $('vVol').textContent = parseFloat(e.target.value).toFixed(2); });
$('bBowl').addEventListener('click', () => { ensureAudio(); bowl(); }); $('bRerake').addEventListener('click', rakeFresh); $('bFeed').addEventListener('click', () => { feed.x = pond.x; feed.z = pond.z; feed.t = 9; addRipple(pond.x, pond.z, 0.5); status('The koi come to see.'); }); $('bClear').addEventListener('click', liftStones);
$('mbBowl').addEventListener('click', () => { ensureAudio(); bowl(); }); $('mbCine').addEventListener('click', () => { ensureAudio(); cycleCinematic(); });
$('panelToggle').addEventListener('click', () => $('panel').classList.toggle('open'));

// ==== SOUND =========================================================================
/* wind and a trickle of water as the bed; the bamboo fountain's clack, pentatonic chimes on gusts, gravel scrape under the rake,
   a stone's thud, koi sips, the frog's plop, a singing bowl with a long decay, and a temple bell on the hour. Quiet by default. */
let audio = null; const SND = { volume: 0.35, master: null, wind: null, water: null, announced: false };
/* iOS keeps Web Audio silent under the ringer switch until an HTML media element has played; a tiny silent clip does that */
let mediaUnlocked = false;
function unlockMedia() { if (mediaUnlocked) return; mediaUnlocked = true; try { const el = document.createElement('audio'); el.setAttribute('playsinline', ''); el.setAttribute('x-webkit-airplay', 'deny'); el.loop = true; el.volume = 0.01; el.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA='; const p = el.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
function ensureAudio() {
  if (audio === false) return null;
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); SND.master = audio.createGain(); SND.master.gain.value = SND.volume; /* phone mix: speakers cannot reproduce the low beds, so roll off below 160 Hz and lift presence; a silent media element played on
       the first gesture moves iOS out of the ringer-muted session so Web Audio is heard even with the silent switch on */
      if (IS_MOBILE) { const hp = audio.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 160; const pk = audio.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = 1400; pk.Q.value = 0.8; pk.gain.value = 4; SND.master.connect(hp).connect(pk).connect(audio.destination); unlockMedia(); } else SND.master.connect(audio.destination);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && audio && audio.state === 'suspended') audio.resume().catch(() => {}); });
    const brown = (sec) => { const len = audio.sampleRate * sec, buf = audio.createBuffer(1, len, audio.sampleRate), d = buf.getChannelData(0); let b = 0; for (let i = 0; i < len; i++) { b = (b + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = b * 3.5; } const f = Math.floor(audio.sampleRate * 0.05); for (let i = 0; i < f; i++) { d[i] *= i / f; d[len - 1 - i] *= i / f; } return buf; };
    const loop = (buf) => { const s = audio.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); return s; };
    const wf = audio.createBiquadFilter(); wf.type = 'bandpass'; wf.frequency.value = 400; wf.Q.value = 0.7; const wg = audio.createGain(); wg.gain.value = 0.03; loop(brown(6)).connect(wf).connect(wg).connect(SND.master); const lfo = audio.createOscillator(); lfo.frequency.value = 0.08; const lg = audio.createGain(); lg.gain.value = 0.02; lfo.connect(lg).connect(wg.gain); lfo.start(); SND.wind = { g: wg, f: wf };
    const tf = audio.createBiquadFilter(); tf.type = 'highpass'; tf.frequency.value = 1800; const tf2 = audio.createBiquadFilter(); tf2.type = 'lowpass'; tf2.frequency.value = 5200; const tg = audio.createGain(); tg.gain.value = 0.012; const t2 = audio.createOscillator(); t2.frequency.value = 3.3; const t2g = audio.createGain(); t2g.gain.value = 0.006; t2.connect(t2g).connect(tg.gain); t2.start(); loop(brown(5)).connect(tf).connect(tf2).connect(tg).connect(SND.master); SND.water = tg;
    audio.onstatechange = () => { if (audio.state === 'running' && !SND.announced) { SND.announced = true; status('Sound on · volume in the Tea House'); } }; } catch (e) { audio = false; return null; } }
  if (audio.state === 'suspended') audio.resume().catch(() => {}); return audio;
}
function setVolume(v) { SND.volume = v; if (SND.master) SND.master.gain.setTargetAtTime(v, audio.currentTime, 0.05); }
const running = () => audio && audio.state === 'running';
function tone(freq, gain, attack, decay, type = 'sine', sweepTo = null) { if (!running()) return; const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t); if (sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo, t + decay); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(0.0002, t + attack + decay); o.connect(g).connect(SND.master); o.start(t); o.stop(t + attack + decay + 0.05); }
function noiseBurst(len, freq, gain, decayPow = 3) { if (!running()) return; const t = audio.currentTime, buf = audio.createBuffer(1, audio.sampleRate * len, audio.sampleRate), d = buf.getChannelData(0); let b = 0; for (let i = 0; i < d.length; i++) { b = (b + 0.05 * (Math.random() * 2 - 1)) / 1.05; d[i] = b * 4 * Math.pow(1 - i / d.length, decayPow); } const s = audio.createBufferSource(); s.buffer = buf; const f = audio.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq; const g = audio.createGain(); g.gain.value = gain; s.connect(f).connect(g).connect(SND.master); s.start(t); }
function boom() { noiseBurst(0.9, 320, 0.7, 2.5); tone(60, 0.12, 0.005, 0.5, 'sine', 35); }
function thunder() { noiseBurst(2.6, 220, 0.6, 1.6); }
function plop(p) { tone(300 + p * 120, 0.06 * p, 0.004, 0.2, 'sine', 90); }
function tink() { tone(2100, 0.035, 0.002, 0.5); tone(3150, 0.015, 0.002, 0.35); }




function scrape(k = 1) { noiseBurst(0.09, 1600, 0.05 * k, 1.5); }
function thud() { noiseBurst(0.25, 240, 0.35, 3); tone(70, 0.08, 0.004, 0.25, 'sine', 45); }
function clack() { noiseBurst(0.06, 2400, 0.12, 2); tone(880, 0.06, 0.002, 0.12, 'square', 620); tone(1760, 0.02, 0.002, 0.08, 'sine'); }
const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
function chimeNote() { const f = PENTA[Math.floor(Math.random() * PENTA.length)]; tone(f, 0.028, 0.004, 2.4, 'sine'); tone(f * 2.76, 0.006, 0.004, 1.1, 'sine'); }
function sip() { tone(1400, 0.012, 0.002, 0.08, 'sine', 900); }
function plop(p) { tone(380 * p + 120, 0.04 * p, 0.003, 0.18, 'sine', 100); noiseBurst(0.12, 900, 0.05 * p, 2); }
function bowl() { if (!running()) return; for (const [f, g, d] of [[261.6, 0.09, 9], [523.2, 0.03, 7], [784.8, 0.015, 5], [1046.5, 0.008, 4]]) { tone(f, g, 0.02, d, 'sine'); tone(f * 1.003, g * 0.6, 0.02, d, 'sine'); } status('…'); }
function templeBell() { for (const [f, g, d] of [[196, 0.05, 5], [392, 0.025, 3.5], [588, 0.012, 2.5], [1176, 0.005, 1.5]]) tone(f, g, 0.01, d); }
function updateSound() { if (!running() || !SND.wind) return; const t = audio.currentTime; SND.wind.g.gain.setTargetAtTime(0.015 + sim.wind * 0.06, t, 0.5); SND.wind.f.frequency.setTargetAtTime(350 + sim.wind * 500, t, 0.5); }

// ==== LOOP ==========================================================================
let last = performance.now(), fps = 60, frames = 0, fpsT = 0, hudT = 0, totalVox = 0;
const pools = {};
function initPools() { pools.dyn = new BoxPool(3500, new THREE.MeshLambertMaterial({ color: 0xffffff }), true); pools.glow = new BoxPool(1200, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, depthWrite: false })); }
function drawCursor() { if (!cursor.on || sim.tool === 'look' || cam.cine >= 0) return; const P = pools.dyn; if (sim.tool === 'rake') { const yaw = mouse.lastGX !== null && mouse.down ? Math.atan2(cursor.x - mouse.lastGX, cursor.z - mouse.lastGZ) : 0; setFrame(cursor.x, 0.45, cursor.z, yaw, 0, 0); part(P, 0, 0.1, 0, CFG.rakeW, 0.12, 0.16, C.darkwood); for (let i = 0; i < 5; i++) part(P, -CFG.rakeW / 2 + 0.2 + i * (CFG.rakeW - 0.4) / 4, -0.1, 0, 0.08, 0.35, 0.08, C.wood2); part(P, 0, 1.2, -0.6, 0.1, 0.1, 2.6, C.wood, 0.5); } else if (sim.tool === 'stone') P.box(cursor.x, 0.6, cursor.z, 1.2, 0.05, 1.2, [0.5, 0.5, 0.45]); else P.box(cursor.x, 0.5, cursor.z, 3.2, 0.05, 3.2, [0.7, 0.7, 0.6]); }
function frame(now) {
  requestAnimationFrame(frame);
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now; sim.t += dt; frames++; fpsT += dt; if (fpsT > 0.5) { fps = frames / fpsT; frames = 0; fpsT = 0; }
  const night = updateSky(dt); updateMaple(dt, sim.wind); updateLife(dt, sim.wind, night); updateStones(dt); if (audio) updateSound();
  const hour = Math.floor(clock.t); if (hour !== clock.lastHour) { clock.lastHour = hour; templeBell(); }
  const snowK = sstep(0.78, 0.86, season.t) * (1 - sstep(0.95, 1, season.t)); drawGravel(snowK);
  pools.dyn.begin(); pools.glow.begin(); drawLife(night); drawCursor(); pools.dyn.end(); pools.glow.end();
  updateCamera(dt); renderer.render(scene, camera);
  hudT += dt; if (hudT > 0.4) { hudT = 0; $('hFps').textContent = fps.toFixed(0); $('hVox').textContent = (totalVox + (canopyMesh ? canopyMesh.userData.count : 0) + stones.reduce((n, s) => n + s.vox, 0)).toLocaleString(); $('hSeason').textContent = seasonName(season.t); $('hTime').textContent = $('vTime').textContent; $('hStones').textContent = stones.length; }
}
(async () => {
  const msg = $('loadmsg'); const step = async m => { msg.textContent = m; await new Promise(r => setTimeout(r, 30)); };
  await step('raising the walls…'); initPools(); buildGarden();
  await step('raking the gravel…'); initGravel(); buildMaple();
  await step('releasing the koi…'); spawnLife(); buildCines(); totalVox = world.count; addStone(-4, 2, 1.5); addStone(6, 0.5, 1.0); addStone(-8, -4, 1.2); for (const s of stones) { s.mesh.position.y = 0.05; s.settled = true; } rakeFresh();
  $('load').style.display = 'none'; last = performance.now(); requestAnimationFrame(frame);
})();
