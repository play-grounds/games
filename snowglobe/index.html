function touchEnd(e) { e.preventDefault(); ensureAudio(); touch.vel = 0; for (const t of e.changedTouches) touch.pts.delete(t.identifier); if (e.touches.length === 0 && !touch.moved && performance.now() - touch.t0 < 400 && e.changedTouches.length === 1) { const t = e.changedTouches[0]; clickGlobe(t.clientX, t.clientY); } if (e.touches.length < 2) touch.lastDist = 0; if (e.touches.length === 1) touch.moved = true; }
canvas.addEventListener('touchend', touchEnd, { passive: false }); canvas.addEventListener('touchcancel', touchEnd, { passive: false });
function cycleCinematic() { cam.cine = cam.cine >= cines.length - 1 ? -1 : cam.cine + 1; if (cam.cine >= 0) { cam.cineT = 0; status(`Cinematic: ${cines[cam.cine].name}`); } else status('Free camera'); }
function toggleUI() { cam.hideUI = !cam.hideUI; for (const id of ['hud', 'panel', 'keys', 'mobilebar', 'panelToggle']) $(id).style.display = cam.hideUI ? 'none' : ''; }
window.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return; ensureAudio(); if (e.code === 'Space') { e.preventDefault(); cycleCinematic(); } else if (e.code === 'KeyS') doShake(1); else if (e.code === 'KeyM') musicBox(); else if (e.code === 'KeyA') { aurora.force = 40; status('The sky ripples.'); } else if (e.code === 'Escape') cam.cine = -1; else if (e.code === 'KeyH') toggleUI(); });
window.addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
$('sSnow').addEventListener('input', e => { wx.fall = parseFloat(e.target.value); $('vSnow').textContent = wx.fall.toFixed(2); });
$('sWind').addEventListener('input', e => { wx.wind = parseFloat(e.target.value); $('vWind').textContent = wx.wind.toFixed(2); });
$('sTime').addEventListener('input', e => { clock.t = parseFloat(e.target.value); }); $('cAuto').addEventListener('change', e => clock.auto = e.target.checked);
$('sVol').addEventListener('input', e => { setVolume(parseFloat(e.target.value)); $('vVol').textContent = parseFloat(e.target.value).toFixed(2); });
$('bShake').addEventListener('click', () => doShake(1)); $('bMusic').addEventListener('click', () => { ensureAudio(); musicBox(); }); $('bClear').addEventListener('click', sweepSnow); $('bAurora').addEventListener('click', () => { aurora.force = 40; status('The sky ripples.'); });
$('mbCine').addEventListener('click', () => { ensureAudio(); cycleCinematic(); }); $('mbShake').addEventListener('click', () => doShake(1)); $('mbMusic').addEventListener('click', () => { ensureAudio(); musicBox(); }); $('mbAurora').addEventListener('click', () => { aurora.force = 40; });
$('panelToggle').addEventListener('click', () => $('panel').classList.toggle('open'));

// ==== SOUND =========================================================================
/* a soft winter wind bed, sleigh bells that jingle as the sleigh trots, a music box tune when the globe is shaken or wound,
   a church chime on the hour, and a plop for snowballs. One master gain, unlocked on the first gesture, kept quiet. */
let audio = null; const SND = { volume: 0.3, master: null, wind: null, announced: false, tune: null };
function ensureAudio() {
  if (audio === false) return null;
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); SND.master = audio.createGain(); SND.master.gain.value = SND.volume; SND.master.connect(audio.destination);
    const len = audio.sampleRate * 6, buf = audio.createBuffer(1, len, audio.sampleRate), d = buf.getChannelData(0); let b = 0; for (let i = 0; i < len; i++) { b = (b + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = b * 3.5; } const f = Math.floor(audio.sampleRate * 0.05); for (let i = 0; i < f; i++) { d[i] *= i / f; d[len - 1 - i] *= i / f; }
    const src = audio.createBufferSource(); src.buffer = buf; src.loop = true; const bp = audio.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 500; bp.Q.value = 0.8; const g = audio.createGain(); g.gain.value = 0.05; const lfo = audio.createOscillator(); lfo.frequency.value = 0.09; const lg = audio.createGain(); lg.gain.value = 0.03; lfo.connect(lg).connect(g.gain); lfo.start(); const lfo2 = audio.createOscillator(); lfo2.frequency.value = 0.13; const lg2 = audio.createGain(); lg2.gain.value = 180; lfo2.connect(lg2).connect(bp.frequency); lfo2.start(); src.connect(bp).connect(g).connect(SND.master); src.start(); SND.wind = { g, bp };
    audio.onstatechange = () => { if (audio.state === 'running' && !SND.announced) { SND.announced = true; status('Sound on · volume on the Mantelpiece'); } }; } catch (e) { audio = false; return null; } }
  if (audio.state === 'suspended') audio.resume().catch(() => {}); return audio;
}
function setVolume(v) { SND.volume = v; if (SND.master) SND.master.gain.setTargetAtTime(v, audio.currentTime, 0.05); }
const running = () => audio && audio.state === 'running';
function tone(freq, gain, attack, decay, type = 'sine', sweepTo = null) { if (!running()) return; const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t); if (sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo, t + decay); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(0.0002, t + attack + decay); o.connect(g).connect(SND.master); o.start(t); o.stop(t + attack + decay + 0.05); }
function noiseBurst(len, freq, gain, decayPow = 3) { if (!running()) return; const t = audio.currentTime, buf = audio.createBuffer(1, audio.sampleRate * len, audio.sampleRate), d = buf.getChannelData(0); let b = 0; for (let i = 0; i < d.length; i++) { b = (b + 0.05 * (Math.random() * 2 - 1)) / 1.05; d[i] = b * 4 * Math.pow(1 - i / d.length, decayPow); } const s = audio.createBufferSource(); s.buffer = buf; const f = audio.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq; const g = audio.createGain(); g.gain.value = gain; s.connect(f).connect(g).connect(SND.master); s.start(t); }
function boom() { noiseBurst(0.9, 320, 0.7, 2.5); tone(60, 0.12, 0.005, 0.5, 'sine', 35); }
function thunder() { noiseBurst(2.6, 220, 0.6, 1.6); }
function plop(p) { tone(300 + p * 120, 0.06 * p, 0.004, 0.2, 'sine', 90); }
function tink() { tone(2100, 0.035, 0.002, 0.5); tone(3150, 0.015, 0.002, 0.35); }



function jingle() { if (!running()) return; if (Math.hypot(camera.position.x - sleigh.x, camera.position.z - sleigh.z) > 90) return; for (let i = 0; i < 3; i++) tone(2800 + rnd(1500), 0.012, 0.002, 0.12 + rnd(0.1), 'sine'); }
function plop() { tone(420, 0.05, 0.003, 0.15, 'sine', 120); }
function churchChime() { for (const [f, g, d] of [[523, 0.035, 3], [1046, 0.015, 2], [1568, 0.006, 1.2]]) tone(f, g, 0.01, d); }
const TUNE = [0, 4, 7, 12, 7, 4, 0, -5, 0, 4, 9, 7, 4, 2, 0, 4, 7, 12, 14, 12, 9, 7, 4, 7, 0];   // semitones from C5, a little music-box waltz
function musicBox() { if (!running()) return; if (SND.tune && audio.currentTime < SND.tune) { return; } const t0 = audio.currentTime + 0.1; const step = 0.32; TUNE.forEach((n, i) => { const f = 523.25 * Math.pow(2, n / 12); setTimeout(() => { tone(f, 0.05, 0.003, 1.2, 'sine'); tone(f * 3, 0.012, 0.003, 0.5, 'sine'); }, (t0 - audio.currentTime + i * step) * 1000); }); SND.tune = t0 + TUNE.length * step; status('♪ the music box plays'); }
function updateSound() { if (!running() || !SND.wind) return; const t = audio.currentTime; SND.wind.g.gain.setTargetAtTime(0.03 + wx.wind * 0.07 + shake.amp * 0.08, t, 0.4); }

// ==== LOOP ==========================================================================
let last = performance.now(), fps = 60, frames = 0, fpsT = 0, hudT = 0, totalVox = 0;
const pools = {};
function initPools() { pools.dyn = new BoxPool(3000, new THREE.MeshLambertMaterial({ color: 0xffffff }), true); pools.glow = new BoxPool(800, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95, depthWrite: false })); pools.smoke = new BoxPool(500, new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.5, depthWrite: false })); pools.flake = new BoxPool(CFG.flakes + 10, new THREE.MeshLambertMaterial({ color: 0xffffff })); pools.aurora = new BoxPool(200, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, depthWrite: false, blending: THREE.AdditiveBlending }));
  for (const k of ['dyn', 'smoke', 'flake', 'aurora']) { scene.remove(pools[k].mesh); globe.add(pools[k].mesh); } }
function frame(now) {
  requestAnimationFrame(frame);
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now; frames++; fpsT += dt; if (fpsT > 0.5) { fps = frames / fpsT; frames = 0; fpsT = 0; }
  const night = updateSky(dt); updateSnow(dt); updateLife(dt); if (audio) updateSound();
  pools.dyn.begin(); pools.glow.begin(); pools.smoke.begin(); drawLife(night); pools.dyn.end(); pools.glow.end(); pools.smoke.end(); drawSnow(); drawAurora();
  updateCamera(dt); renderer.render(scene, camera);
  hudT += dt; if (hudT > 0.4) { hudT = 0; $('hFps').textContent = fps.toFixed(0); $('hVox').textContent = totalVox.toLocaleString(); $('hFlakes').textContent = flakes.filter(f => f.live).length; $('hDepth').textContent = (wx.avgDepth || 0).toFixed(2); $('hTime').textContent = $('vTime').textContent; }
}
(async () => {
  const msg = $('loadmsg'); const step = async m => { msg.textContent = m; await new Promise(r => setTimeout(r, 30)); };
  await step('blowing the glass…'); initPools(); buildGlobe();
  await step('building the village…'); buildVillage(); buildSky();
  await step('letting it snow…'); initSnow(); spawnLife(); buildCines(); totalVox = world.count + room.count;
  $('load').style.display = 'none'; last = performance.now(); requestAnimationFrame(frame);
})();
</script>
