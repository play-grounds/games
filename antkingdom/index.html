  if (sim.tool === 'dig') { let n = 0; for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) { if (Math.abs(dx) + Math.abs(dy) > 1 && rng() < 0.5) continue; if (carve(h.x + dx, h.y + dy)) n++; } if (n) { mouse.scrapeT -= 1 / 60; if (mouse.scrapeT <= 0) { mouse.scrapeT = 0.08; scrape(); } fieldT = 0; } }

  else if (sim.tool === 'water') { for (let dx = -1; dx <= 1; dx++) { const x = h.x + dx; if (!inside(x, h.y)) continue; const i = ci(x, h.y); if (cells[i] === 0 || cells[i] === 2) cells[i] = 4; } }
}
function clickAction(h) { if (sim.tool === 'food') { addFoodAt(h.x, h.y); status('Sugar!'); } else applyTool(h); }
canvas.addEventListener('mousedown', e => { ensureAudio(); mouse.down = true; mouse.btn = e.button; mouse.sx = e.clientX; mouse.sy = e.clientY; mouse.moved = false; mouse.x = e.clientX; mouse.y = e.clientY; if (e.button !== 0) e.preventDefault(); if (e.button === 0 && !e.shiftKey && sim.tool !== 'look' && sim.tool !== 'food') { const h = tankHit(e.clientX, e.clientY); if (h) applyTool(h); } });
window.addEventListener('mousemove', e => { const dx = e.clientX - mouse.x, dy = e.clientY - mouse.y; mouse.x = e.clientX; mouse.y = e.clientY; if (!mouse.down) return; if (Math.abs(e.clientX - mouse.sx) + Math.abs(e.clientY - mouse.sy) > 4) mouse.moved = true; if (mouse.moved) cam.cine = -1;
  const orbit = mouse.btn === 2 || (mouse.btn === 0 && (sim.tool === 'look' || e.shiftKey)); if (orbit) { cam.az = clamp(cam.az - dx * 0.005, -0.9, 0.9); cam.el = clamp(cam.el + dy * 0.005, -0.2, 0.9); } else if (mouse.btn === 1) { const s = cam.dist * 0.0015; cam.target.x -= dx * s; cam.target.y += dy * s; } else if (sim.tool !== 'food') { const h = tankHit(e.clientX, e.clientY); if (h) applyTool(h); } });
window.addEventListener('mouseup', e => { if (!mouse.down) return; mouse.down = false; if (e.button !== 0 || mouse.moved || sim.tool === 'look') return; const h = tankHit(e.clientX, e.clientY); if (h) clickAction(h); });
window.addEventListener('pointerup', () => ensureAudio(), { passive: true });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.cine = -1; cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 10, 140); }, { passive: false });
const touch = { pts: new Map(), lastDist: 0, midX: 0, midY: 0, startX: 0, startY: 0, t0: 0, moved: false };
canvas.addEventListener('touchstart', e => { e.preventDefault(); ensureAudio(); for (const t of e.changedTouches) touch.pts.set(t.identifier, { x: t.clientX, y: t.clientY }); if (e.touches.length === 1) { const t = e.touches[0]; touch.startX = t.clientX; touch.startY = t.clientY; touch.t0 = performance.now(); touch.moved = false; if (sim.tool !== 'look' && sim.tool !== 'food') { const h = tankHit(t.clientX, t.clientY); if (h) applyTool(h); } } else if (e.touches.length >= 2) { const a = e.touches[0], b = e.touches[1]; touch.lastDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); touch.midX = (a.clientX + b.clientX) / 2; touch.midY = (a.clientY + b.clientY) / 2; touch.moved = true; } }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); if (e.touches.length === 1) { const t = e.touches[0], prev = touch.pts.get(t.identifier) || { x: t.clientX, y: t.clientY }; const dx = t.clientX - prev.x, dy = t.clientY - prev.y; if (Math.abs(t.clientX - touch.startX) + Math.abs(t.clientY - touch.startY) > 8) touch.moved = true; if (touch.moved) { cam.cine = -1; if (sim.tool === 'look') { cam.az = clamp(cam.az - dx * 0.006, -0.9, 0.9); cam.el = clamp(cam.el + dy * 0.006, -0.2, 0.9); } else if (sim.tool !== 'food') { const h = tankHit(t.clientX, t.clientY); if (h) applyTool(h); } } } else if (e.touches.length >= 2) { const a = e.touches[0], b = e.touches[1]; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), mx = (a.clientX + b.clientX) / 2, my = (a.clientY + b.clientY) / 2; if (touch.lastDist > 0) cam.dist = clamp(cam.dist * touch.lastDist / d, 10, 140); const s = cam.dist * 0.0018; cam.target.x -= (mx - touch.midX) * s; cam.target.y += (my - touch.midY) * s; cam.cine = -1; touch.lastDist = d; touch.midX = mx; touch.midY = my; } for (const t of e.changedTouches) touch.pts.set(t.identifier, { x: t.clientX, y: t.clientY }); }, { passive: false });
function touchEnd(e) { e.preventDefault(); ensureAudio(); for (const t of e.changedTouches) touch.pts.delete(t.identifier); if (e.touches.length === 0 && !touch.moved && performance.now() - touch.t0 < 400 && e.changedTouches.length === 1 && sim.tool !== 'look') { const t = e.changedTouches[0]; const h = tankHit(t.clientX, t.clientY); if (h) clickAction(h); } if (e.touches.length < 2) touch.lastDist = 0; if (e.touches.length === 1) touch.moved = true; }
canvas.addEventListener('touchend', touchEnd, { passive: false }); canvas.addEventListener('touchcancel', touchEnd, { passive: false });
function cycleCinematic() { cam.cine = cam.cine >= cines.length - 1 ? -1 : cam.cine + 1; if (cam.cine >= 0) { cam.cineT = 0; status(`Cinematic: ${cines[cam.cine].name}`); } else status('Free camera'); }
function toggleUI() { cam.hideUI = !cam.hideUI; for (const id of ['hud', 'panel', 'keys', 'mobilebar', 'panelToggle']) $(id).style.display = cam.hideUI ? 'none' : ''; }
window.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return; ensureAudio(); if (e.code === 'Space') { e.preventDefault(); cycleCinematic(); } else if (e.code === 'Digit1') setTool('dig'); else if (e.code === 'Digit2') setTool('fill'); else if (e.code === 'Digit3') setTool('food'); else if (e.code === 'Digit4') setTool('water'); else if (e.code === 'Digit5') setTool('look'); else if (e.code === 'KeyR') startRain(); else if (e.code === 'KeyX') startRaid(); else if (e.code === 'KeyA') startAnteater(); else if (e.code === 'KeyF') dropCrumbs(); else if (e.code === 'Escape') cam.cine = -1; else if (e.code === 'KeyH') toggleUI(); });
window.addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
for (const [id, t] of [['mDig', 'dig'], ['mFill', 'fill'], ['mFood', 'food'], ['mWater', 'water'], ['mLook', 'look'], ['mbDig', 'dig'], ['mbFood', 'food'], ['mbLook', 'look']]) $(id).addEventListener('click', () => setTool(t));
$('sSpeed').addEventListener('input', e => { sim.speed = parseFloat(e.target.value); $('vSpeed').textContent = sim.speed.toFixed(1) + '×'; });
$('sTime').addEventListener('input', e => { clock.t = parseFloat(e.target.value); }); $('cAuto').addEventListener('change', e => clock.auto = e.target.checked); $('cTrails').addEventListener('change', e => showTrails = e.target.checked);
$('sVol').addEventListener('input', e => { setVolume(parseFloat(e.target.value)); $('vVol').textContent = parseFloat(e.target.value).toFixed(2); });
$('bRain').addEventListener('click', () => { ensureAudio(); startRain(); }); $('bRaid').addEventListener('click', () => { ensureAudio(); startRaid(); }); $('bAnteater').addEventListener('click', () => { ensureAudio(); startAnteater(); }); $('bCrumbs').addEventListener('click', dropCrumbs);
$('mbRain').addEventListener('click', () => { ensureAudio(); startRain(); }); $('mbRaid').addEventListener('click', () => { ensureAudio(); startRaid(); }); $('mbAnt').addEventListener('click', () => { ensureAudio(); startAnteater(); });
$('panelToggle').addEventListener('click', () => $('panel').classList.toggle('open'));

// ==== SOUND =========================================================================
/* garden ambience: birds by day and crickets at night over a soft air bed, rain when it rains, gravel scrape when you dig,
   tiny squeaks in a fight, a slurp for the anteater, a soft chime when an egg hatches, an alarm chirp for the raid. Quiet by default. */
let audio = null; const SND = { volume: 0.3, master: null, air: null, rain: null, announced: false, birdT: 6, cricketT: 2 };
/* iOS keeps Web Audio silent under the ringer switch until an HTML media element has played; a tiny silent clip does that */
let mediaUnlocked = false;
function unlockMedia() { if (mediaUnlocked) return; mediaUnlocked = true; try { const el = document.createElement('audio'); el.setAttribute('playsinline', ''); el.setAttribute('x-webkit-airplay', 'deny'); el.loop = true; el.volume = 0.01; el.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA='; const p = el.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
function ensureAudio() {
  if (audio === false) return null;
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); SND.master = audio.createGain(); SND.master.gain.value = SND.volume; /* phone mix: speakers cannot reproduce the low beds, so roll off below 160 Hz and lift presence; a silent media element played on
       the first gesture moves iOS out of the ringer-muted session so Web Audio is heard even with the silent switch on */
      if (IS_MOBILE) { const hp = audio.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 160; const pk = audio.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = 1400; pk.Q.value = 0.8; pk.gain.value = 4; SND.master.connect(hp).connect(pk).connect(audio.destination); unlockMedia(); } else SND.master.connect(audio.destination);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && audio && audio.state === 'suspended') audio.resume().catch(() => {}); });
    const brown = (sec) => { const len = audio.sampleRate * sec, buf = audio.createBuffer(1, len, audio.sampleRate), d = buf.getChannelData(0); let b = 0; for (let i = 0; i < len; i++) { b = (b + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = b * 3.5; } const f = Math.floor(audio.sampleRate * 0.05); for (let i = 0; i < f; i++) { d[i] *= i / f; d[len - 1 - i] *= i / f; } return buf; };
    const loop = (buf) => { const s = audio.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); return s; };
    const af = audio.createBiquadFilter(); af.type = 'lowpass'; af.frequency.value = 500; const ag = audio.createGain(); ag.gain.value = 0.02; loop(brown(6)).connect(af).connect(ag).connect(SND.master); SND.air = ag;
    const rf = audio.createBiquadFilter(); rf.type = 'bandpass'; rf.frequency.value = 2600; rf.Q.value = 0.6; const rg = audio.createGain(); rg.gain.value = 0; const white = audio.createBuffer(1, audio.sampleRate * 3, audio.sampleRate), wd = white.getChannelData(0); for (let i = 0; i < wd.length; i++) wd[i] = (Math.random() * 2 - 1) * 0.5; loop(white).connect(rf).connect(rg).connect(SND.master); SND.rain = rg;
    audio.onstatechange = () => { if (audio.state === 'running' && !SND.announced) { SND.announced = true; status('Sound on · volume on the Keeper\'s Bench'); } }; } catch (e) { audio = false; return null; } }
  if (audio.state === 'suspended') audio.resume().catch(() => {}); return audio;
}
function setVolume(v) { SND.volume = v; if (SND.master) SND.master.gain.setTargetAtTime(v, audio.currentTime, 0.05); }
const running = () => audio && audio.state === 'running';
function tone(freq, gain, attack, decay, type = 'sine', sweepTo = null) { if (!running()) return; const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t); if (sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo, t + decay); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(0.0002, t + attack + decay); o.connect(g).connect(SND.master); o.start(t); o.stop(t + attack + decay + 0.05); }
function noiseBurst(len, freq, gain, decayPow = 3) { if (!running()) return; const t = audio.currentTime, buf = audio.createBuffer(1, audio.sampleRate * len, audio.sampleRate), d = buf.getChannelData(0); let b = 0; for (let i = 0; i < d.length; i++) { b = (b + 0.05 * (Math.random() * 2 - 1)) / 1.05; d[i] = b * 4 * Math.pow(1 - i / d.length, decayPow); } const s = audio.createBufferSource(); s.buffer = buf; const f = audio.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq; const g = audio.createGain(); g.gain.value = gain; s.connect(f).connect(g).connect(SND.master); s.start(t); }
function boom() { noiseBurst(0.9, 320, 0.7, 2.5); tone(60, 0.12, 0.005, 0.5, 'sine', 35); }
function thunder() { noiseBurst(2.6, 220, 0.6, 1.6); }
function plop(p) { tone(300 + p * 120, 0.06 * p, 0.004, 0.2, 'sine', 90); }
function tink() { tone(2100, 0.035, 0.002, 0.5); tone(3150, 0.015, 0.002, 0.35); }





function scrape() { noiseBurst(0.07, 1400, 0.05, 1.5); }
function squeak() { tone(rnd(2200, 3200), 0.012, 0.005, 0.08, 'triangle', rnd(1500, 2000)); }
function slurp() { tone(220, 0.05, 0.01, 0.3, 'sawtooth', 600); noiseBurst(0.2, 900, 0.06, 2); }
function hatch() { tone(1568, 0.02, 0.004, 0.9, 'sine'); tone(2093, 0.01, 0.004, 0.6, 'sine'); }
function alarm() { for (let i = 0; i < 4; i++) setTimeout(() => tone(1800 + i * 200, 0.03, 0.005, 0.12, 'square', 1200), i * 160); }
function bird() { const f = rnd(1800, 2600); tone(f, 0.02, 0.01, 0.12, 'sine', f * 1.3); setTimeout(() => tone(f * 1.2, 0.016, 0.01, 0.18, 'sine', f * 0.9), 160); if (Math.random() < 0.5) setTimeout(() => tone(f * 1.1, 0.012, 0.01, 0.1, 'sine', f * 1.4), 340); }
function cricket() { for (let i = 0; i < 5; i++) setTimeout(() => tone(4200, 0.008, 0.003, 0.03, 'square'), i * 55); }
function updateSound(dt, night) { if (!running()) return; const t = audio.currentTime; SND.rain.gain.setTargetAtTime(rain.on ? 0.05 : 0, t, 0.8); SND.air.gain.setTargetAtTime(0.012 + (1 - night) * 0.012, t, 0.5);
  if (night < 0.4 && !rain.on) { SND.birdT -= dt; if (SND.birdT <= 0) { SND.birdT = rnd(5, 14); bird(); } } if (night > 0.6) { SND.cricketT -= dt; if (SND.cricketT <= 0) { SND.cricketT = rnd(1.5, 4); cricket(); } } }

// ==== LOOP ==========================================================================
let last = performance.now(), fps = 60, frames = 0, fpsT = 0, hudT = 0, gridT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now; sim.t += dt; frames++; fpsT += dt; if (fpsT > 0.5) { fps = frames / fpsT; frames = 0; fpsT = 0; }
  const night = updateSky(dt); const sdt = dt * sim.speed; sim.crumbT -= sdt; if (sim.crumbT <= 0) { sim.crumbT = rnd(20, 40); const x = clamp(NX - 24 + rint(-5, 5), 1, NX - 2); const i = ci(x, surfaceTop[x] + 1); if (cells[i] === 0) { food[i] = Math.min(9, food[i] + rint(1, 3)); rebuildFields(); } } updateAnts(dt, sim.speed); gridT += sdt; if (gridT > 0.12) { tickGrid(gridT); gridT = 0; } updateRain(dt); updateRaid(sdt); updateAnteater(dt); storeT -= dt; if (storeT <= 0) { storeT = 1.2; const st = chambers.filter(c => c.role === 'store'); if (st.length) bfs(distStore, st.flatMap(c => c.cellsList)); }
  if (audio) updateSound(dt, night);
  pools.dyn.begin(); pools.glow.begin(); pools.rain.begin(); drawGrid(); drawLife(night); pools.dyn.end(); pools.glow.end(); pools.rain.end();
  updateCamera(dt); renderer.render(scene, camera);
  hudT += dt; if (hudT > 0.4) { hudT = 0; $('hFps').textContent = fps.toFixed(0); $('hAnts').textContent = ants.filter(a => a.team === 0).length + (raid.active ? ' · ' + ants.filter(a => a.team === 1).length + ' red' : ''); $('hEggs').textContent = eggs.filter(e => !e.larva).length + ' · ' + eggs.filter(e => e.larva).length; $('hFood').textContent = colony.store; $('hDug').textContent = dugCount; $('hDay').textContent = colony.day; }
}
(async () => {
  const msg = $('loadmsg'); const step = async m => { msg.textContent = m; await new Promise(r => setTimeout(r, 30)); };
  await step('filling the tank…'); initPools(); buildGrid();
  await step('setting the picnic…'); buildSurface(); buildCines();
  await step('waking the colony…'); spawnColony(); rebuildFields(); const st = chambers.filter(c => c.role === 'store'); if (st.length) bfs(distStore, st.flatMap(c => c.cellsList));
  $('load').style.display = 'none'; last = performance.now(); requestAnimationFrame(frame);
})();
