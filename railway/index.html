$('sThr').addEventListener('input', e => { sim.thr = parseFloat(e.target.value); $('vThr').textContent = sim.thr.toFixed(2); if (sim.thr > 1.7) status('Careful on the curves…'); });
$('sTime').addEventListener('input', e => { clock.t = parseFloat(e.target.value); }); $('cAuto').addEventListener('change', e => clock.auto = e.target.checked);
$('sVol').addEventListener('input', e => { setVolume(parseFloat(e.target.value)); $('vVol').textContent = parseFloat(e.target.value).toFixed(2); });
$('bSwA').addEventListener('click', () => toggleSwitch('A')); $('bSwC').addEventListener('click', () => toggleSwitch('C')); $('bWhistle').addEventListener('click', () => { ensureAudio(); whistle(); }); $('bReset').addEventListener('click', () => { ensureAudio(); rerail(); });
$('mbCine').addEventListener('click', () => { ensureAudio(); cycleCinematic(); }); $('mbSwA').addEventListener('click', () => toggleSwitch('A')); $('mbWhistle').addEventListener('click', () => { ensureAudio(); whistle(); }); $('mbReset').addEventListener('click', () => { ensureAudio(); rerail(); }); $('mbFollow').addEventListener('click', () => { unfollow(); cam.cine = -1; });
$('panelToggle').addEventListener('click', () => $('panel').classList.toggle('open'));

// ==== SOUND =========================================================================
/* steam chuffs paced to the wheels, a diesel drone that follows speed, a two-tone whistle and horn, crossing bells, a church bell
   on the hour, point clacks, and a crash. All through one master gain; unlocked on the first gesture; kept subtle. */
let audio = null; const SND = { volume: 0.3, master: null, drone: null, announced: false };
function ensureAudio() {
  if (audio === false) return null;
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); SND.master = audio.createGain(); SND.master.gain.value = SND.volume; SND.master.connect(audio.destination);
    const o = audio.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 55; const f = audio.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 220; const g = audio.createGain(); g.gain.value = 0; const lfo = audio.createOscillator(); lfo.frequency.value = 7; const lg = audio.createGain(); lg.gain.value = 0.004; lfo.connect(lg).connect(g.gain); lfo.start(); o.connect(f).connect(g).connect(SND.master); o.start(); SND.drone = { o, g };
    audio.onstatechange = () => { if (audio.state === 'running' && !SND.announced) { SND.announced = true; status('Sound on · volume in the Signal Box'); } }; } catch (e) { audio = false; return null; } }
  if (audio.state === 'suspended') audio.resume().catch(() => {}); return audio;
}
function setVolume(v) { SND.volume = v; if (SND.master) SND.master.gain.setTargetAtTime(v, audio.currentTime, 0.05); }
const running = () => audio && audio.state === 'running';
function tone(freq, gain, attack, decay, type = 'sine', sweepTo = null) { if (!running()) return; const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t); if (sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo, t + decay); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(0.0002, t + attack + decay); o.connect(g).connect(SND.master); o.start(t); o.stop(t + attack + decay + 0.05); }
function noiseBurst(len, freq, gain, decayPow = 3) { if (!running()) return; const t = audio.currentTime, buf = audio.createBuffer(1, audio.sampleRate * len, audio.sampleRate), d = buf.getChannelData(0); let b = 0; for (let i = 0; i < d.length; i++) { b = (b + 0.05 * (Math.random() * 2 - 1)) / 1.05; d[i] = b * 4 * Math.pow(1 - i / d.length, decayPow); } const s = audio.createBufferSource(); s.buffer = buf; const f = audio.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq; const g = audio.createGain(); g.gain.value = gain; s.connect(f).connect(g).connect(SND.master); s.start(t); }
function boom() { noiseBurst(0.9, 320, 0.7, 2.5); tone(60, 0.12, 0.005, 0.5, 'sine', 35); }
function thunder() { noiseBurst(2.6, 220, 0.6, 1.6); }
function plop(p) { tone(300 + p * 120, 0.06 * p, 0.004, 0.2, 'sine', 90); }
function tink() { tone(2100, 0.035, 0.002, 0.5); tone(3150, 0.015, 0.002, 0.35); }


function chuff(speed) { if (!running()) return; noiseBurst(0.12, 900 + speed * 60, 0.05 + Math.min(0.08, speed * 0.008), 2); }
function whistle() { if (!running()) return; const t = audio.currentTime; for (const [f, g] of [[622, 0.035], [784, 0.03], [932, 0.02]]) { const o = audio.createOscillator(), gn = audio.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(f * 0.97, t); o.frequency.linearRampToValueAtTime(f, t + 0.08); const v = audio.createOscillator(); v.frequency.value = 5.5; const vg = audio.createGain(); vg.gain.value = 4; v.connect(vg).connect(o.frequency); v.start(t); gn.gain.setValueAtTime(0.0001, t); gn.gain.linearRampToValueAtTime(g, t + 0.06); gn.gain.setValueAtTime(g, t + 0.7); gn.gain.exponentialRampToValueAtTime(0.0003, t + 1.1); o.connect(gn).connect(SND.master); o.start(t); o.stop(t + 1.15); v.stop(t + 1.15); } }
function horn() { if (!running()) return; for (const [f, g] of [[311, 0.05], [392, 0.04]]) tone(f, g, 0.05, 0.9, 'sawtooth'); }
function bell(cr) { if (!running()) return; tone(1760, 0.012, 0.002, 0.35, 'sine'); tone(2637, 0.005, 0.002, 0.2, 'sine'); }
function churchBell() { for (const [f, g, d] of [[392, 0.04, 3], [784, 0.02, 2], [1176, 0.008, 1.2]]) tone(f, g, 0.01, d); }
function clack() { noiseBurst(0.05, 1400, 0.12, 2); tone(220, 0.03, 0.002, 0.08, 'square'); }
function crash() { noiseBurst(1.2, 600, 0.35, 2); for (let i = 0; i < 6; i++) setTimeout(() => noiseBurst(0.3, 1500, 0.1, 2), 150 + i * 180); }
function updateSound() { if (!running() || !SND.drone) return; const fr = trains[1]; const sp = fr && !fr.derailed ? fr.speed : 0; const t = audio.currentTime; SND.drone.g.gain.setTargetAtTime(sp > 0.2 ? 0.03 + Math.min(1, sp / 8) * 0.03 : 0, t, 0.4); SND.drone.o.frequency.setTargetAtTime(48 + Math.min(1, sp / 8) * 40, t, 0.4); }

// ==== LOOP ==========================================================================
let last = performance.now(), fps = 60, frames = 0, fpsT = 0, hudT = 0, totalVox = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now; sim.t += dt; frames++; fpsT += dt; if (fpsT > 0.5) { fps = frames / fpsT; frames = 0; fpsT = 0; }
  const night = updateDay(dt); updateTrains(dt, sim.thr); updateTraffic(dt); updatePeople(dt); updatePuffs(dt); if (audio) updateSound();
  pools.dyn.begin(); pools.glow.begin(); pools.smoke.begin(); drawTrains(night); drawTraffic(night); drawScenery(night); pools.dyn.end(); pools.glow.end(); pools.smoke.end();
  updateCamera(dt); renderer.render(scene, camera);
  hudT += dt; if (hudT > 0.4) { hudT = 0; $('hFps').textContent = fps.toFixed(0); $('hVox').textContent = totalVox.toLocaleString(); $('hT1').textContent = trains[0].derailed ? 'derailed' : trains[0].dwell > 0 ? 'at station' : trains[0].speed.toFixed(1) + ' m/s'; $('hT2').textContent = trains[1].derailed ? 'derailed' : trains[1].track.name + ' ' + trains[1].speed.toFixed(1); $('hTime').textContent = $('vTime').textContent; }
}
(async () => {
  const msg = $('loadmsg'); const step = async m => { msg.textContent = m; await new Promise(r => setTimeout(r, 30)); };
  await step('laying the baseboard…'); initPools(); buildTracks(); buildTerrain();
  await step('building the town…'); buildScenery(); buildRails(); totalVox = world.count + waterSet.count;
  await step('coupling the trains…'); spawnTrains(); stationS = stationRange(); spawnPeople(); spawnTraffic(); buildCines();
  $('load').style.display = 'none'; last = performance.now(); requestAnimationFrame(frame);
})();
</script>
