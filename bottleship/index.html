const canvas = $('c');

canvas.addEventListener('touchend', touchEnd, { passive: false }); canvas.addEventListener('touchcancel', touchEnd, { passive: false });
function shakeBottle() { ensureAudio(); status('Whoa!'); shake = 1.2; for (let i = 0; i < 6; i++) addRipple(rnd(-B.halfL, B.halfL + 6), rnd(-6, 6), 0.7, 4); ship.vy += 3.5; ship.rollV += rnd(-3, 3); ship.pitchV += rnd(-1.5, 1.5); for (let i = 0; i < 40; i++) addSpray(rnd(-16, 16), W.level + 0.5, rnd(-6, 6), 0, 5, 0, 1, 0.14); for (const d of dolphins) if (d.state === 'under') d.t = Math.min(d.t, rnd(0.2, 1.5)); tink(); }
function jumpDolphins() { for (const d of dolphins) if (d.state === 'under') d.t = Math.min(d.t, rnd(0.1, 1.2)); }
function toggleUI() { cam.hideUI = !cam.hideUI; for (const id of ['hud', 'panel', 'keys', 'mobilebar', 'panelToggle']) $(id).style.display = cam.hideUI ? 'none' : ''; }
window.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return; ensureAudio(); if (e.code === 'KeyC') fireCannons(); else if (e.code === 'KeyS') shakeBottle(); else if (e.code === 'KeyK') summonSerpent(); else if (e.code === 'KeyD') jumpDolphins(); else if (e.code === 'KeyH') toggleUI(); });
window.addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
$('sWave').addEventListener('input', e => { sea.amp = parseFloat(e.target.value) * 1.3 + 0.08; $('vWave').textContent = parseFloat(e.target.value).toFixed(2); });
$('sWind').addEventListener('input', e => { sea.wind = parseFloat(e.target.value); $('vWind').textContent = sea.wind.toFixed(2); });
$('sTime').addEventListener('input', e => { clock.t = parseFloat(e.target.value); });
$('cAuto').addEventListener('change', e => clock.auto = e.target.checked);
$('selWx').addEventListener('change', e => { wx.mode = e.target.value; });
$('sVol').addEventListener('input', e => { setVolume(parseFloat(e.target.value)); $('vVol').textContent = parseFloat(e.target.value).toFixed(2); });
$('bCannon').addEventListener('click', fireCannons); $('bShake').addEventListener('click', shakeBottle); $('bSerpent').addEventListener('click', () => { ensureAudio(); summonSerpent(); }); $('bDolphin').addEventListener('click', () => { ensureAudio(); jumpDolphins(); });
$('mbCannon').addEventListener('click', fireCannons); $('mbShake').addEventListener('click', shakeBottle); $('mbSerpent').addEventListener('click', () => { ensureAudio(); summonSerpent(); }); $('mbDolphin').addEventListener('click', () => { ensureAudio(); jumpDolphins(); });
$('panelToggle').addEventListener('click', () => $('panel').classList.toggle('open'));

// ==== LOOP ==========================================================================
let last = performance.now(), fps = 60, frames = 0, fpsT = 0, hudT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now; frames++; fpsT += dt; if (fpsT > 0.5) { fps = frames / fpsT; frames = 0; fpsT = 0; }
  updateWeather(dt); updateOcean(dt); updateShip(dt); updateBalls(dt); updateLife(dt); updateSpray(dt); updateAmbience(dt); if (audio) updateSound();
  pools.dyn.begin(); pools.glow.begin(); pools.cloud.begin(); pools.sail.begin();
  drawShipDynamic(); drawBalls(); drawLife(); drawWeather();
  pools.dyn.end(); pools.glow.end(); pools.cloud.end(); pools.sail.end();
  camPos(); if (shake > 0) { shake = Math.max(0, shake - dt * 2); camera.position.x += rnd(-1, 1) * shake * 0.6; camera.position.y += rnd(-1, 1) * shake * 0.6; }
  sun.target.position.set(0, -3, 0);
  renderer.render(scene, camera);
  hudT += dt; if (hudT > 0.4) { hudT = 0; $('hFps').textContent = fps.toFixed(0); $('hVox').textContent = (world.count + ship.voxels + sea.cols.length).toLocaleString(); $('hTime').textContent = $('vTime').textContent; }
}
(async () => {
  const msg = $('loadmsg'); const step = async m => { msg.textContent = m; await new Promise(r => setTimeout(r, 30)); };
  await step('blowing the glass…'); buildBottle();
  await step('carving the desk and the island…'); buildRoom(); buildStatic();
  await step('filling the sea…'); buildOcean();
  await step('rigging the ship…'); buildShip(); spawnLife();
  sea.amp = 0.5 * 1.3 + 0.08; wx.pt = 0;
  $('load').style.display = 'none'; last = performance.now(); requestAnimationFrame(frame);
})();
</script>
</body>
